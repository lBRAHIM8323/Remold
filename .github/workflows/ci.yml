# Unit tests, and Remold in a real VS Code downloading the real Filee, on Linux, Windows and macOS.
# Also runs every Monday, so a new Filee release that breaks Remold shows up here before users notice.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration (Remold downloads Filee)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          REMOLD_FILEE: managed
      - name: Integration (Remold downloads Filee)
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          REMOLD_FILEE: managed
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: remold-vsix
          path: '*.vsix'
